<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>Pokedex - App</title>
		<link
			href="https://cdn.jsdelivr.net/npm/daisyui@5"
			rel="stylesheet"
			type="text/css"
		/>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="script.js" defer></script>
	</head>
	<body onload="init()">
		<header>
			<a href="#">
				<img src="./assets/logo.png" alt="Logo" height="75" />
			</a>

			<div class="search-container">
				<input
					id="search-input"
					class="input search-input"
					data-id="search-input"
					type="search"
					placeholder="Search Pokémon"
					autocomplete="off"
				/>
				<p id="search-hint" class="search-hint" aria-live="polite"></p>
			</div>
		</header>

		<main id="main" data-id="content">
			<ul id="pokemon-container" class="pokemon-container"></ul>

			<div id="loading" class="loading d-none" aria-live="polite">
				<div class="spinner"></div>
				<p>Loading Pokémon...</p>
			</div>

			<p id="error-message" class="error-message" aria-live="polite"></p>

			<!-- load more button -->
			<button data-id="load-more-button" id="load-more-btn">
				Load More
			</button>

			<dialog
				id="pokemon-dialog"
				data-id="dialog"
				class="pokemon-dialog"
				aria-label="Pokémon details"
			></dialog>
		</main>

		<footer></footer>
	</body>
</html>
