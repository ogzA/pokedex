<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./styles/style.css" />
		<title>Pokedex - App</title>

		<script src="./script.js" defer></script>
	</head>
	<body onload="init()">
		<header>
			<div class="container">
				<a class="logo-title" href="/">
					<img src="./assets/img/logo.png" alt="Logo" height="75" />
					<h1>Pokedex</h1>
				</a>

				<div class="search-container">
					<div class="input-container">
						<input
							id="search-input"
							class="input search-input"
							data-id="search-input"
							type="search"
							placeholder="Search Pokémon"
							autocomplete="off"
						/>
						<p
							id="search-hint"
							class="search-hint"
							aria-live="polite"
						></p>
					</div>
					<button
						id="search-btn"
						data-id="search-button"
						class="search-btn"
					>
						Search
					</button>
				</div>
			</div>
		</header>

		<main id="main" data-id="content">
			<section class="pokemon-section">
				<ul
					id="pokemon-container"
					class="pokemon-container container"
				></ul>
			</section>

			<section class="helpers-section">
				<div class="container">
					<div id="loading" class="loading d-none" aria-live="polite">
						<div class="spinner"></div>
						<p>Loading Pokémon...</p>
					</div>

					<p
						id="error-message"
						class="error-message"
						aria-live="polite"
					></p>

					<!-- load more button -->
					<button data-id="load-more-button" id="load-more-btn">
						Load More
					</button>
				</div>
			</section>

			<dialog
				id="pokemon-dialog"
				data-id="dialog"
				class="pokemon-dialog"
				aria-label="Pokémon details"
			></dialog>
		</main>
	</body>
</html>
